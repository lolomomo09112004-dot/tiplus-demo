<style>

/* Verre plus transparent */
:root{--glass:rgba(255,255,255,.34);--edge:rgba(255,255,255,.75)}
.g{backdrop-filter:blur(16px) saturate(170%);-webkit-backdrop-filter:blur(16px) saturate(170%)}
.top.g,.nav.g{background:color-mix(in srgb,var(--teal) 60%,transparent)!important;backdrop-filter:blur(28px) saturate(190%)!important;-webkit-backdrop-filter:blur(28px) saturate(190%)!important}
html,html.gapfix{background:color-mix(in srgb,var(--teal) 60%,var(--bg2))!important;background-color:color-mix(in srgb,var(--teal) 60%,var(--bg2))!important}
/* Reliefs */
.g{box-shadow:inset 0 1px 0 rgba(255,255,255,.95),inset 0 -1px 0 rgba(11,53,51,.07),0 2px 4px rgba(11,53,51,.05),0 12px 28px var(--shc,rgba(18,128,124,.18))}
.top.g{box-shadow:inset 0 -1px 0 rgba(255,255,255,.35),0 10px 28px var(--shc,rgba(18,128,124,.25))!important}
.nav.g{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 -10px 28px var(--shc,rgba(18,128,124,.25))!important}
.btn.t,.mini.t,.seg button[aria-selected=true],.slot[aria-pressed=true],.opt[aria-pressed=true]{background-image:linear-gradient(180deg,rgba(255,255,255,.24),rgba(255,255,255,0) 52%,rgba(0,0,0,.1));box-shadow:inset 0 1px 0 rgba(255,255,255,.4),inset 0 -2px 0 rgba(0,0,0,.14),0 6px 14px var(--shc,rgba(18,128,124,.25))}
.btn.o,.mini.o{background-image:linear-gradient(180deg,rgba(255,255,255,.35),rgba(255,255,255,0) 52%,rgba(0,0,0,.12));box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -2px 0 rgba(0,0,0,.18),0 6px 16px var(--goldglow,rgba(0,0,0,.18))}
.btn:active,.mini:active,.opt:active,.slot:active{box-shadow:inset 0 2px 6px rgba(0,0,0,.2)!important}
.q{background:radial-gradient(circle at 35% 28%,#FFFFFF,rgba(255,255,255,.55) 70%)!important;box-shadow:inset 0 -2px 3px rgba(11,53,51,.12),0 3px 8px rgba(11,53,51,.14)!important}
.sc-btn{background:radial-gradient(circle at 35% 28%,color-mix(in srgb,var(--h2) 60%,#fff),var(--teal) 50%,color-mix(in srgb,var(--teal) 70%,#000))!important;box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -4px 8px rgba(0,0,0,.28),0 10px 24px rgba(0,0,0,.25),0 0 0 6px rgba(255,255,255,.3)!important}
.hero,.rcard{box-shadow:inset 0 1px 0 rgba(255,255,255,.45),inset 0 -14px 28px rgba(0,0,0,.14),0 4px 8px rgba(11,53,51,.1),0 18px 36px var(--shc,rgba(18,128,124,.3))}
.photo{box-shadow:0 4px 8px rgba(11,53,51,.12),0 22px 40px var(--shc,rgba(18,128,124,.3))}
.stamps i:not(.f){box-shadow:inset 0 3px 6px rgba(11,53,51,.16),0 1px 0 rgba(255,255,255,.9)}
.stamps i.f{box-shadow:inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.2),0 0 14px var(--goldglow,rgba(0,0,0,.18))}
h1,h2{text-shadow:0 1px 0 rgba(255,255,255,.7),0 3px 10px rgba(11,53,51,.12)}
.top b{text-shadow:0 1px 2px rgba(0,0,0,.2)}
.stp-ov{position:fixed;z-index:35;width:0;height:0;pointer-events:none}
.stp-seal{position:absolute;left:0;top:0;width:calc(var(--s)*1.15);height:calc(var(--s)*1.15);border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--h2),var(--h1));box-shadow:inset 0 2px 0 rgba(255,255,255,.55),inset 0 -5px 10px rgba(0,0,0,.25),0 14px 30px var(--shc,rgba(18,128,124,.3)),0 0 0 4px rgba(255,255,255,.6);will-change:transform,opacity}
.stp-seal svg{width:52%;height:52%;filter:drop-shadow(0 1px 1px rgba(0,0,0,.25))}
.stp-wave{position:absolute;left:0;top:0;width:var(--s);height:var(--s);border-radius:50%;border:3px solid var(--teal);opacity:0}
.stp-wave.w2{border-width:2px;border-color:var(--h2)}
.pg{overflow-x:hidden}
.stamps{justify-content:space-between;gap:8px!important}
.stamps i{font-size:.85rem;min-width:0}
.hero p,.rcard p{color:rgba(255,255,255,.88)!important}
.rw-ov{position:fixed;inset:0;z-index:40;display:grid;place-items:center;padding:24px;background:rgba(6,30,28,.45);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:rwfade .25s both;overflow:hidden}
@keyframes rwfade{from{opacity:0}}
.rw-rays{position:absolute;left:50%;top:50%;width:820px;height:820px;margin:-410px 0 0 -410px;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,255,255,.22) 0 8deg,transparent 8deg 22deg);-webkit-mask:radial-gradient(circle,#000 18%,transparent 62%);mask:radial-gradient(circle,#000 18%,transparent 62%);opacity:0;transition:opacity .6s;animation:rwspin 16s linear infinite;pointer-events:none}
.rw-ov.won .rw-rays{opacity:1}
@keyframes rwspin{to{transform:rotate(360deg)}}
.rw-card{position:relative;width:min(100%,360px);border-radius:30px;padding:24px 20px;text-align:center;background:rgba(255,255,255,.88);border:1px solid rgba(255,255,255,.9);box-shadow:inset 0 1px 0 #fff,0 24px 60px rgba(0,0,0,.3);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:rwpop .45s cubic-bezier(.2,1.4,.4,1) both}
@keyframes rwpop{from{transform:scale(.7);opacity:0}}
.rw-k{margin:0;color:var(--muted);font-weight:700;font-size:.9rem}
.rw-ov.won .rw-k{color:var(--teal)}
.rw-reel{height:88px;display:grid;place-items:center;overflow:hidden;margin:14px 0;border-radius:22px;background:linear-gradient(145deg,var(--h1),var(--h2));color:#fff;box-shadow:inset 0 2px 0 rgba(255,255,255,.4),inset 0 -8px 16px rgba(0,0,0,.22)}
.rw-reel b{display:block;font-size:1.4rem;letter-spacing:-.02em;padding:0 12px;line-height:1.15}
.rw-tag{margin:0 0 12px;font-weight:700}
.rw-end{display:grid;gap:10px}
.rw-code{margin:0}.rw-code b{font-size:1.4rem;letter-spacing:.06em;color:var(--teal)}
.cf{position:fixed;z-index:41;width:9px;height:14px;border-radius:2px;pointer-events:none}
@media (prefers-reduced-motion:reduce){.rw-rays{animation:none}.rw-card{animation:none}}
/* Solution 2 : barre flottante, fond uni en bas */
html .nav,html.gapfix .nav{left:50%!important;right:auto!important;transform:translateX(-50%)!important;width:min(92%,440px)!important;bottom:calc(12px + env(safe-area-inset-bottom,0px))!important;border-radius:34px!important;border:1px solid rgba(255,255,255,.3)!important;padding:8px!important}
html.gapfix .nav{bottom:12px!important}
.nav::after{display:none!important}
.nav.g{box-shadow:inset 0 1px 0 rgba(255,255,255,.5),0 12px 30px var(--shc,rgba(18,128,124,.3))!important}
html,html.gapfix{background:var(--bg2)!important;background-color:var(--bg2)!important}
body{background:radial-gradient(420px 360px at -8% 42%,rgba(255,255,255,.9),transparent 70%),radial-gradient(380px 360px at 108% 50%,var(--glowA),transparent 70%),linear-gradient(180deg,var(--bg1) 0,var(--bg1) 120px,var(--bg2) 72%,var(--bg2))!important;background-attachment:fixed!important}
